[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeengine"
version = "0.1.0"
description = "Universal Code Search & Edit Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.0",
    "aiosqlite==0.20.0",
    "tree-sitter==0.22.3",
    "tree-sitter-python==0.21.0",
    "tree-sitter-java==0.21.0",
    "tree-sitter-javascript==0.21.0",
    "tree-sitter-typescript==0.21.0",
    "tree-sitter-go==0.21.0",
    "tree-sitter-rust==0.21.1",
    "ast-grep-py==0.22.0",
    "gitpython==3.1.43",
    "watchdog==4.0.0",
    "docker==7.1.0",
    "httpx==0.27.0",
    "python-ulid==2.2.0",
    "pywebview==5.1",
]

[project.scripts]
ce = "codeengine.cli:main"
